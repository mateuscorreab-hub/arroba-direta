# Versão de teste no Render (plano grátis).
# Como usar: no painel do Render, "New > Blueprint", escolha este repositório e confirme.
# Saem três serviços (API, site e app no navegador) e um banco Postgres.
# Limites do plano grátis: a API "dorme" após 15 min sem uso (a primeira abertura leva ~1 min)
# e o banco grátis expira 30 dias após criado.

databases:
  - name: arroba-db
    plan: free
    databaseName: arroba_direta
    user: arroba

services:
  - type: web
    name: arroba-api
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npx -y pnpm@10.28.0 turbo run build --filter=@arroba/api
    # Aplica as migrations, cria os lotes de exemplo (só na primeira vez) e sobe a API.
    startCommand: node apps/api/dist/db/migrar.js && node apps/api/dist/db/seed.js && node apps/api/dist/main.js
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: arroba-db
          property: connectionString
      # Versão de teste: sem SMS, o código de login aparece na tela do app. Quem sabe um número entra na
      # conta dele, então não serve com gente de verdade. Para ligar o SMS: primeiro COMTELE_API_KEY
      # (abaixo) no painel do Render; depois trocar este valor para "sms" aqui no arquivo.
      - key: CODIGO_MODO
        value: teste
      # Chave dos códigos guardados no banco (HMAC). O Render cria sozinho; não precisa ver nem copiar.
      - key: CODIGO_SEGREDO
        generateValue: true
      # Teto de SMS por dia, somando todos os números: segura o gasto se alguém disparar pedidos de código.
      - key: CODIGO_SMS_POR_DIA
        value: "50"
      # Conta na Comtele, que manda o SMS. A chave não fica neste arquivo: preencha no painel do Render
      # (arroba-api > Environment) com a do painel da Comtele (no antigo, API > Chave de API; no novo,
      # Configurações > Chaves de API). COMTELE_ROTA só no painel novo: o número da rota de envio.
      - key: COMTELE_API_KEY
        sync: false
      - key: COMTELE_ROTA
        sync: false
      # Versão de teste: o lote anunciado já entra na busca, sem revisão, para dar para testar a negociação.
      # Trocar para "manual" quando existir o painel de moderação.
      - key: APROVACAO_LOTES
        value: automatica
      # Fotos e vídeo dos anúncios na conta do Cloudinary. Os valores não ficam neste arquivo (têm o
      # segredo da conta): preencha no painel do Render (arroba-api > Environment) com o que aparece no
      # painel do Cloudinary, em Settings > API Keys (Cloud name, API Key e API Secret). Sem as três, o
      # envio de fotos fica desligado (o disco do Render é apagado a cada reinício). Só parte delas ou
      # valor errado: a API não sobe e o log diz o que falta.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: arroba-site
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npx -y pnpm@10.28.0 turbo run build --filter=@arroba/web
    startCommand: npx -y pnpm@10.28.0 --filter @arroba/web start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        fromService:
          name: arroba-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: arroba-app
    runtime: static
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npx -y pnpm@10.28.0 turbo run build --filter=@arroba/shared && cd apps/mobile && npx expo export --platform web --output-dir dist
    staticPublishPath: ./apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CI
        value: "1"
      - key: EXPO_PUBLIC_API_URL
        fromService:
          name: arroba-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
