# Versão de teste no Render (plano grátis).
# Como usar: no painel do Render, "New > Blueprint", escolha este repositório e confirme.
# Saem três serviços (API, site e app no navegador) e um banco Postgres.
# Limites do plano grátis: a API "dorme" após 15 min sem uso (a primeira abertura leva ~1 min)
# e o banco grátis expira 30 dias após criado.

databases:
  - name: arroba-db
    plan: free
    databaseName: arroba_direta
    user: arroba

services:
  - type: web
    name: arroba-api
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npx -y pnpm@10.28.0 turbo run build --filter=@arroba/api
    # Aplica as migrations, cria os lotes de exemplo (só na primeira vez) e sobe a API.
    startCommand: node apps/api/dist/db/migrar.js && node apps/api/dist/db/seed.js && node apps/api/dist/main.js
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: arroba-db
          property: connectionString
      # Versão de teste: sem SMS, o código de login aparece na tela do app.
      - key: CODIGO_MODO
        value: teste
      # Fotos e vídeo dos anúncios. O valor não fica neste arquivo (tem o segredo da conta):
      # cole no painel do Render (arroba-api > Environment) o "API environment variable" do
      # Cloudinary, no formato cloudinary://API_KEY:API_SECRET@CLOUD_NAME. Sem ele o envio de
      # fotos fica desligado (o disco do Render é apagado a cada reinício). Valor errado: a API não sobe.
      - key: CLOUDINARY_URL
        sync: false

  - type: web
    name: arroba-site
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npx -y pnpm@10.28.0 turbo run build --filter=@arroba/web
    startCommand: npx -y pnpm@10.28.0 --filter @arroba/web start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        fromService:
          name: arroba-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: arroba-app
    runtime: static
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npx -y pnpm@10.28.0 turbo run build --filter=@arroba/shared && cd apps/mobile && npx expo export --platform web --output-dir dist
    staticPublishPath: ./apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CI
        value: "1"
      - key: EXPO_PUBLIC_API_URL
        fromService:
          name: arroba-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
