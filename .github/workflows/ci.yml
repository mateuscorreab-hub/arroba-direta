name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: arroba
          POSTGRES_PASSWORD: arroba
          POSTGRES_DB: arroba_direta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arroba" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://arroba:arroba@localhost:5432/arroba_direta
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Testes da API com banco
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm --filter @arroba/api test:e2e
